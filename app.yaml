command: ['npm', 'run', 'start']
env:
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: TARGET_LAKEBASE_ENDPOINT
    valueFrom: benchmark-postgres
  - name: TARGET_PGDATABASE
    value: databricks_postgres
  - name: TARGET_POOL_SIZE
    value: '80'
  - name: DATABRICKS_JOB_ID
    valueFrom: load-job
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LAKELOAD_CATALOG
    value: main
  - name: LAKELOAD_SCHEMA
    value: lakeload
  - name: LAKELOAD_LAKEBASE_CATALOG
    value: lakeload_pg
